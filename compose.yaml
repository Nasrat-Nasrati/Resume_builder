name: ${COMPOSE_PROJECT_NAME:-kabulcv}

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kabulcv}
      POSTGRES_USER: ${POSTGRES_USER:-kabulcv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kabulcv-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kabulcv} -d ${POSTGRES_DB:-kabulcv}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-58025}:8025"

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-kabulcv}:${POSTGRES_PASSWORD:-kabulcv-local-only}@db:5432/${POSTGRES_DB:-kabulcv}"
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
    ports:
      - "127.0.0.1:${BACKEND_PORT:-58000}:8000"
    volumes:
      - ./backend:/app
      - private_media:/app/private_media
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health/').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: ./backend
    command: sh -c "celery -A config worker --loglevel=info --concurrency=$${CELERY_WORKER_CONCURRENCY:-1}"
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-kabulcv}:${POSTGRES_PASSWORD:-kabulcv-local-only}@db:5432/${POSTGRES_DB:-kabulcv}"
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - ./backend:/app
      - private_media:/app/private_media
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:58000/api/v1}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-53000}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  private_media:
  frontend_node_modules:
